<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizSys — All Results</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="dashboard.html">Quiz<span>Sys</span> <span style="font-size:0.7rem;color:var(--purple);font-family:var(--font);font-weight:600;background:rgba(188,140,255,0.1);border-radius:4px;padding:2px 6px">ADMIN</span></a>
    <div class="navbar-links" id="navbar-links"></div>
  </nav>

  <div class="sidebar-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="quizzes.html">📝 Manage Quizzes</a>
        <a href="create-quiz.html">➕ Create Quiz</a>
        <a href="users.html">👥 Users</a>
        <a href="results.html" class="active">📊 All Results</a>
        <hr class="sidebar-divider" />
        <a href="javascript:Auth.logout()">🚪 Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h2>All Quiz Results</h2>
          <p>Complete submission history across all students</p>
        </div>
        <div style="display:flex;gap:0.5rem;align-items:center">
          <select id="filter-quiz" class="form-control" onchange="applyFilter()" style="width:200px">
            <option value="">All Quizzes</option>
          </select>
          <select id="filter-status" class="form-control" onchange="applyFilter()" style="width:150px">
            <option value="">All Statuses</option>
            <option value="passed">Passed</option>
            <option value="failed">Failed</option>
            <option value="timed_out">Timed Out</option>
          </select>
        </div>
      </div>

      <div id="loading" class="spinner-wrap"><div class="spinner"></div></div>

      <div id="main-ui" class="hidden">
        <div class="stats-grid" id="stats-grid" style="margin-bottom:1.5rem"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Student</th>
                <th>Quiz</th>
                <th>Score</th>
                <th>Points</th>
                <th>Result</th>
                <th>Status</th>
                <th>Submitted</th>
                <th>Detail</th>
              </tr>
            </thead>
            <tbody id="results-tbody"></tbody>
          </table>
        </div>
        <div id="no-results" class="hidden" style="text-align:center;padding:2rem;color:var(--text-muted)">No results match your filter.</div>
      </div>
    </main>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    if (!Auth.requireAuth(true)) throw new Error();
    populateNavbar('admin');

    let allResults = [];

    async function load() {
      const { ok, data } = await API.get('/admin/results');
      document.getElementById('loading').classList.add('hidden');
      if (!ok) { Toast.show('Failed to load results', 'error'); return; }

      allResults = data.results;

      // Populate quiz filter
      const quizNames = [...new Set(allResults.map(r => r.quiz_title))];
      const sel = document.getElementById('filter-quiz');
      quizNames.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        sel.appendChild(opt);
      });

      // Stats
      const passed  = allResults.filter(r => r.passed).length;
      const avg     = allResults.length ? (allResults.reduce((s, r) => s + parseFloat(r.percentage), 0) / allResults.length).toFixed(1) : 0;
      const timeout = allResults.filter(r => r.status === 'timed_out').length;

      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card"><div class="stat-value">${allResults.length}</div><div class="stat-label">Total Submissions</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--success)">${passed}</div><div class="stat-label">Passed</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--danger)">${allResults.length - passed}</div><div class="stat-label">Failed</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--accent)">${avg}%</div><div class="stat-label">Average Score</div></div>
      `;

      renderTable(allResults);
      document.getElementById('main-ui').classList.remove('hidden');
    }

    function applyFilter() {
      const quiz   = document.getElementById('filter-quiz').value;
      const status = document.getElementById('filter-status').value;

      let filtered = allResults;
      if (quiz)   filtered = filtered.filter(r => r.quiz_title === quiz);
      if (status === 'passed')   filtered = filtered.filter(r => r.passed);
      if (status === 'failed')   filtered = filtered.filter(r => !r.passed && r.status !== 'timed_out');
      if (status === 'timed_out') filtered = filtered.filter(r => r.status === 'timed_out');

      renderTable(filtered);
      document.getElementById('no-results').classList.toggle('hidden', filtered.length > 0);
    }

    function renderTable(results) {
      document.getElementById('results-tbody').innerHTML = results.map((r, i) => `
        <tr>
          <td class="mono text-muted">${i + 1}</td>
          <td>
            <div style="font-weight:600">${escapeHtml(r.username)}</div>
            <div style="font-size:0.78rem;color:var(--text-muted)">${escapeHtml(r.email)}</div>
          </td>
          <td>${escapeHtml(r.quiz_title)}</td>
          <td>
            <span style="font-weight:700;font-size:1rem;color:${r.passed ? 'var(--success)' : 'var(--danger)'}">
              ${parseFloat(r.percentage).toFixed(1)}%
            </span>
          </td>
          <td class="mono">${r.score}/${r.total_points}</td>
          <td><span class="badge ${r.passed ? 'badge-success' : 'badge-danger'}">${r.passed ? 'Passed' : 'Failed'}</span></td>
          <td><span class="badge ${r.status === 'timed_out' ? 'badge-warning' : 'badge-info'}">${r.status}</span></td>
          <td class="text-muted" style="font-size:0.82rem">${formatDate(r.submitted_at)}</td>
          <td><a href="../results.html?attemptId=${r.id}" class="btn btn-secondary btn-sm" target="_blank">View</a></td>
        </tr>
      `).join('');
    }

    function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str||''; return d.innerHTML; }
    load();
  </script>
</body>
</html>
