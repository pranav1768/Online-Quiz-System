<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizSys — Create Quiz</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .q-builder {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
      position: relative;
    }
    .q-builder-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .q-num { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); }
    .opt-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .opt-row input[type=text] { flex: 1; }
    .opt-row input[type=radio] { accent-color: var(--accent); flex-shrink: 0; }
    .opt-correct-label { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="dashboard.html">Quiz<span>Sys</span> <span style="font-size:0.7rem;color:var(--purple);font-family:var(--font);font-weight:600;background:rgba(188,140,255,0.1);border-radius:4px;padding:2px 6px">ADMIN</span></a>
    <div class="navbar-links" id="navbar-links"></div>
  </nav>

  <div class="sidebar-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="quizzes.html">📝 Manage Quizzes</a>
        <a href="create-quiz.html" class="active">➕ Create Quiz</a>
        <a href="users.html">👥 Users</a>
        <a href="results.html">📊 All Results</a>
        <hr class="sidebar-divider" />
        <a href="javascript:Auth.logout()">🚪 Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h2>Create New Quiz</h2>
          <p>Build a quiz with questions and options</p>
        </div>
        <a href="quizzes.html" class="btn btn-secondary">← Back to Quizzes</a>
      </div>

      <div id="global-alert" class="alert hidden"></div>

      <!-- Quiz Meta -->
      <div class="card mb-3">
        <div class="card-header"><div class="card-title">Quiz Details</div></div>
        <div class="form-group">
          <label class="form-label">Quiz Title *</label>
          <input id="quiz-title" type="text" class="form-control" placeholder="e.g. JavaScript Fundamentals" />
          <div id="err-title" class="form-error hidden"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="quiz-desc" class="form-control" rows="2" placeholder="Brief description of this quiz..."></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <div class="form-group">
            <label class="form-label">Duration (minutes) *</label>
            <input id="quiz-duration" type="number" class="form-control" min="1" max="180" value="10" />
            <div class="form-hint">Server-controlled timer</div>
          </div>
          <div class="form-group">
            <label class="form-label">Passing Score (%) *</label>
            <input id="quiz-passing" type="number" class="form-control" min="1" max="100" value="60" />
          </div>
        </div>
      </div>

      <!-- Questions -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <h3 style="font-family:var(--font);font-weight:600">Questions</h3>
        <button class="btn btn-secondary btn-sm" onclick="addQuestion()">+ Add Question</button>
      </div>

      <div id="questions-builder"></div>

      <div style="display:flex;gap:1rem;margin-top:1.5rem">
        <button class="btn btn-secondary" onclick="addQuestion()">+ Add Question</button>
        <button id="btn-submit" class="btn btn-primary btn-lg" onclick="submitQuiz()">🚀 Create Quiz</button>
      </div>
    </main>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    if (!Auth.requireAuth(true)) throw new Error();
    populateNavbar('admin');

    let qCount = 0;

    function addQuestion(defaults = null) {
      qCount++;
      const qid   = `q-${qCount}`;
      const container = document.getElementById('questions-builder');
      const div = document.createElement('div');
      div.className = 'q-builder fade-in';
      div.id = qid;

      const type = defaults?.type || 'mcq';
      const text  = defaults?.text || '';
      const pts   = defaults?.points || 1;

      div.innerHTML = `
        <div class="q-builder-header">
          <span class="q-num">Question ${container.children.length + 1}</span>
          <div style="display:flex;gap:0.5rem;align-items:center">
            <select class="form-control" id="${qid}-type" onchange="onTypeChange('${qid}')" style="width:auto;padding:0.35rem 0.6rem;font-size:0.82rem">
              <option value="mcq" ${type==='mcq'?'selected':''}>MCQ</option>
              <option value="true_false" ${type==='true_false'?'selected':''}>True/False</option>
            </select>
            <input type="number" class="form-control" id="${qid}-pts" value="${pts}" min="1" max="10" style="width:70px;padding:0.35rem 0.6rem;font-size:0.82rem" title="Points" />
            <button class="btn btn-danger btn-sm" onclick="removeQuestion('${qid}')">✕</button>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:0.75rem">
          <textarea class="form-control" id="${qid}-text" placeholder="Enter question text..." rows="2">${escapeHtml(text)}</textarea>
          <div id="err-${qid}" class="form-error hidden"></div>
        </div>

        <div id="${qid}-options">
          <!-- Rendered by buildOptions -->
        </div>
        <button class="btn btn-secondary btn-sm" id="${qid}-add-opt" onclick="addOption('${qid}')" style="margin-top:0.5rem">+ Add Option</button>
      `;

      container.appendChild(div);

      if (type === 'true_false') {
        buildTrueFalseOptions(qid, defaults);
      } else {
        const opts = defaults?.options || [{text:'',correct:false},{text:'',correct:false}];
        opts.forEach(o => addOption(qid, o.text, o.correct));
      }

      renumberQuestions();
    }

    function buildTrueFalseOptions(qid, defaults) {
      const wrap = document.getElementById(`${qid}-options`);
      wrap.innerHTML = '';
      document.getElementById(`${qid}-add-opt`).style.display = 'none';

      const correct = defaults?.correctIndex ?? 0; // 0=True, 1=False
      ['True','False'].forEach((label, idx) => {
        const row = document.createElement('div');
        row.className = 'opt-row';
        row.innerHTML = `
          <input type="radio" name="${qid}-correct" value="${idx}" ${idx===correct?'checked':''} />
          <span class="opt-correct-label">Correct</span>
          <input type="text" class="form-control" value="${label}" readonly style="opacity:0.7" />
        `;
        wrap.appendChild(row);
      });
    }

    let optCounters = {};
    function addOption(qid, text = '', isCorrect = false) {
      optCounters[qid] = (optCounters[qid] || 0) + 1;
      const oid  = `${qid}-opt-${optCounters[qid]}`;
      const wrap = document.getElementById(`${qid}-options`);
      const row  = document.createElement('div');
      row.className = 'opt-row';
      row.id = oid;
      row.innerHTML = `
        <input type="radio" name="${qid}-correct" value="${oid}" ${isCorrect?'checked':''} title="Mark as correct" />
        <span class="opt-correct-label">✓</span>
        <input type="text" class="form-control" id="${oid}-text" placeholder="Option text..." value="${escapeHtml(text)}" />
        <button class="btn btn-danger btn-sm" onclick="removeOption('${oid}','${qid}')" title="Remove">✕</button>
      `;
      wrap.appendChild(row);
    }

    function removeOption(oid, qid) {
      const el = document.getElementById(oid);
      if (!el) return;
      const wrap = document.getElementById(`${qid}-options`);
      if (wrap.querySelectorAll('.opt-row').length <= 2) { Toast.show('At least 2 options required.', 'warning'); return; }
      el.remove();
    }

    function onTypeChange(qid) {
      const type = document.getElementById(`${qid}-type`).value;
      if (type === 'true_false') buildTrueFalseOptions(qid);
      else {
        document.getElementById(`${qid}-options`).innerHTML = '';
        document.getElementById(`${qid}-add-opt`).style.display = '';
        optCounters[qid] = 0;
        addOption(qid); addOption(qid);
      }
    }

    function removeQuestion(qid) {
      document.getElementById(qid)?.remove();
      renumberQuestions();
    }

    function renumberQuestions() {
      document.querySelectorAll('.q-builder .q-num').forEach((el, i) => {
        el.textContent = `Question ${i + 1}`;
      });
    }

    // -------------------------------------------------------
    // COLLECT & SUBMIT
    // -------------------------------------------------------
    async function submitQuiz() {
      hideError('global-alert');
      document.querySelectorAll('.form-error').forEach(e => e.classList.add('hidden'));

      const title    = document.getElementById('quiz-title').value.trim();
      const desc     = document.getElementById('quiz-desc').value.trim();
      const duration = parseInt(document.getElementById('quiz-duration').value);
      const passing  = parseInt(document.getElementById('quiz-passing').value);

      if (!title)               { showError('err-title', 'Title is required'); return; }
      if (!duration || duration < 1) { Toast.show('Duration must be at least 1 minute', 'warning'); return; }

      const builderCards = document.querySelectorAll('.q-builder');
      if (builderCards.length === 0) { Toast.show('Add at least one question.', 'warning'); return; }

      const questions = [];
      let valid = true;

      builderCards.forEach((card, idx) => {
        const qid  = card.id;
        const text = document.getElementById(`${qid}-text`).value.trim();
        const type = document.getElementById(`${qid}-type`).value;
        const pts  = parseInt(document.getElementById(`${qid}-pts`).value) || 1;

        if (!text) {
          showError(`err-${qid}`, 'Question text is required');
          valid = false; return;
        }

        let options = [];
        const correctRadio = card.querySelector(`input[name="${qid}-correct"]:checked`);

        if (type === 'true_false') {
          const correctIdx = correctRadio ? parseInt(correctRadio.value) : 0;
          options = [
            { text: 'True',  is_correct: correctIdx === 0 },
            { text: 'False', is_correct: correctIdx === 1 },
          ];
        } else {
          const optRows = card.querySelectorAll(`#${qid}-options .opt-row`);
          optRows.forEach(row => {
            const txtInput = row.querySelector('input[type=text]');
            const radio    = row.querySelector('input[type=radio]');
            const txt = txtInput?.value.trim() || '';
            if (!txt) { valid = false; Toast.show(`Q${idx+1}: All option texts are required`, 'warning'); return; }
            options.push({ text: txt, is_correct: radio?.checked || false });
          });

          const hasCorrect = options.some(o => o.is_correct);
          if (!hasCorrect) { Toast.show(`Q${idx+1}: Select one correct answer`, 'warning'); valid = false; return; }
        }

        questions.push({ question_text: text, question_type: type, points: pts, options });
      });

      if (!valid) return;

      setLoading('btn-submit', true);
      try {
        const { ok, data } = await API.post('/admin/quizzes', {
          title, description: desc, duration_minutes: duration, passing_score: passing, questions,
        });

        if (!ok) {
          const al = document.getElementById('global-alert');
          al.textContent = data.message || data.errors?.[0]?.msg || 'Failed to create quiz.';
          al.className = 'alert alert-error';
          return;
        }

        Toast.show('Quiz created successfully!', 'success');
        setTimeout(() => window.location.href = 'quizzes.html', 1000);
      } catch (err) {
        Toast.show('Network error.', 'error');
      } finally {
        setLoading('btn-submit', false);
      }
    }

    function escapeHtml(str) {
      const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML;
    }

    // Start with 2 questions
    addQuestion();
    addQuestion();
  </script>
</body>
</html>
