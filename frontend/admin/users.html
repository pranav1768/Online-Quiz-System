<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizSys — Users</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="dashboard.html">Quiz<span>Sys</span> <span style="font-size:0.7rem;color:var(--purple);font-family:var(--font);font-weight:600;background:rgba(188,140,255,0.1);border-radius:4px;padding:2px 6px">ADMIN</span></a>
    <div class="navbar-links" id="navbar-links"></div>
  </nav>

  <div class="sidebar-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="quizzes.html">📝 Manage Quizzes</a>
        <a href="create-quiz.html">➕ Create Quiz</a>
        <a href="users.html" class="active">👥 Users</a>
        <a href="results.html">📊 All Results</a>
        <hr class="sidebar-divider" />
        <a href="javascript:Auth.logout()">🚪 Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h2>User Management</h2>
          <p>View and manage student accounts</p>
        </div>
        <div style="display:flex;gap:0.5rem;align-items:center">
          <input type="text" class="form-control" id="search-input" placeholder="Search by name or email..." style="width:220px" oninput="filterUsers()" />
        </div>
      </div>

      <div id="loading" class="spinner-wrap"><div class="spinner"></div></div>

      <div id="main-ui" class="hidden">
        <div class="stats-grid" id="stats-grid" style="margin-bottom:1.5rem"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Attempts</th>
                <th>Joined</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
        <div id="no-results" class="hidden" style="text-align:center;padding:2rem;color:var(--text-muted)">No users match your search.</div>
      </div>
    </main>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    if (!Auth.requireAuth(true)) throw new Error();
    populateNavbar('admin');

    let allUsers = [];

    async function load() {
      const { ok, data } = await API.get('/admin/users');
      document.getElementById('loading').classList.add('hidden');
      if (!ok) { Toast.show('Failed to load users', 'error'); return; }

      allUsers = data.users;
      const students = allUsers.filter(u => u.role === 'student');
      const active   = students.filter(u => u.is_active);

      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card"><div class="stat-value">${allUsers.length}</div><div class="stat-label">Total Users</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--success)">${active.length}</div><div class="stat-label">Active Students</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--danger)">${students.length - active.length}</div><div class="stat-label">Disabled</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--purple)">${allUsers.filter(u=>u.role==='admin').length}</div><div class="stat-label">Admins</div></div>
      `;

      renderTable(allUsers);
      document.getElementById('main-ui').classList.remove('hidden');
    }

    function renderTable(users) {
      const currentUser = Auth.getUser();
      document.getElementById('users-tbody').innerHTML = users.map((u, i) => `
        <tr id="user-row-${u.id}">
          <td class="mono text-muted">${i + 1}</td>
          <td><strong>${escapeHtml(u.username)}</strong> ${u.id === currentUser.id ? '<span class="badge badge-purple" style="margin-left:4px">You</span>' : ''}</td>
          <td class="text-muted" style="font-size:0.85rem">${escapeHtml(u.email)}</td>
          <td><span class="badge ${u.role === 'admin' ? 'badge-purple' : 'badge-info'}">${u.role}</span></td>
          <td class="mono">${u.total_attempts}</td>
          <td class="text-muted" style="font-size:0.82rem">${formatDate(u.created_at)}</td>
          <td>
            <span class="badge ${u.is_active ? 'badge-success' : 'badge-danger'}" id="user-badge-${u.id}">
              ${u.is_active ? 'Active' : 'Disabled'}
            </span>
          </td>
          <td>
            ${u.id !== currentUser.id ? `
              <button class="btn btn-secondary btn-sm" id="toggle-user-${u.id}" onclick="toggleUser(${u.id})">
                ${u.is_active ? 'Disable' : 'Enable'}
              </button>
            ` : '<span class="text-muted text-sm">—</span>'}
          </td>
        </tr>
      `).join('');
    }

    function filterUsers() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = allUsers.filter(u =>
        u.username.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)
      );
      renderTable(filtered);
      document.getElementById('no-results').classList.toggle('hidden', filtered.length > 0);
    }

    async function toggleUser(id) {
      const btn = document.getElementById(`toggle-user-${id}`);
      btn.disabled = true;
      const { ok, data } = await API.patch(`/admin/users/${id}/toggle`, {});
      btn.disabled = false;
      if (!ok) { Toast.show(data.message || 'Failed', 'error'); return; }

      const badge = document.getElementById(`user-badge-${id}`);
      badge.textContent = data.is_active ? 'Active' : 'Disabled';
      badge.className   = `badge ${data.is_active ? 'badge-success' : 'badge-danger'}`;
      btn.textContent   = data.is_active ? 'Disable' : 'Enable';
      Toast.show(`User ${data.is_active ? 'enabled' : 'disabled'}.`, 'success');
    }

    function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str||''; return d.innerHTML; }
    load();
  </script>
</body>
</html>
