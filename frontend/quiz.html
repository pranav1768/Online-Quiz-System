<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizSys — Take Quiz</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { overflow-x: hidden; }
    .quiz-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(13,17,23,0.95); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 0.75rem;
    }
    .quiz-main { max-width: 780px; margin: 2rem auto; padding: 0 1.5rem 4rem; }
    .nav-btns  { display: flex; gap: 0.75rem; align-items: center; justify-content: space-between; margin-top: 1.5rem; }

    /* Confirm modal */
    #confirm-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 200; display: none; align-items: center; justify-content: center;
    }
    #confirm-overlay.open { display: flex; }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-screen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <div style="text-align:center">
      <div class="spinner" style="margin:0 auto 1rem"></div>
      <p>Loading quiz...</p>
    </div>
  </div>

  <!-- Quiz UI (hidden until loaded) -->
  <div id="quiz-ui" class="hidden">
    <!-- Timer bar -->
    <div class="timer-bar"><div id="timer-fill" class="timer-fill" style="width:100%"></div></div>

    <!-- Header -->
    <div class="quiz-header">
      <div>
        <div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Quiz</div>
        <div id="quiz-title" style="font-weight:600;font-size:1rem"></div>
      </div>
      <div style="display:flex;align-items:center;gap:1rem">
        <div id="timer-display" class="timer-display">⏱ 00:00</div>
        <button class="btn btn-danger btn-sm" onclick="openConfirm()">Submit Quiz</button>
      </div>
    </div>

    <!-- Main -->
    <div class="quiz-main">
      <!-- Progress -->
      <div style="margin-bottom:1.5rem">
        <div style="display:flex;justify-content:space-between;font-size:0.82rem;color:var(--text-muted);margin-bottom:0.4rem">
          <span id="q-progress-text">Question 0 of 0</span>
          <span id="q-answered-text">0 answered</span>
        </div>
        <div class="progress"><div id="progress-fill" class="progress-fill" style="width:0%"></div></div>
      </div>

      <!-- Navigation dots -->
      <div id="q-nav" class="q-nav"></div>

      <!-- Questions -->
      <div id="questions-container"></div>

      <!-- Prev / Next -->
      <div class="nav-btns">
        <button id="btn-prev" class="btn btn-secondary" onclick="goTo(currentQ - 1)" disabled>← Prev</button>
        <button id="btn-next" class="btn btn-primary"   onclick="goTo(currentQ + 1)">Next →</button>
      </div>
    </div>
  </div>

  <!-- Timeout overlay -->
  <div id="timeout-overlay" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:2rem;">
    <div style="font-size:4rem">⏰</div>
    <h2 style="margin:1rem 0 0.5rem;color:var(--danger)">Time's Up!</h2>
    <p style="margin-bottom:1.5rem">Your quiz has been automatically submitted.</p>
    <div class="spinner" id="submit-spinner"></div>
  </div>

  <!-- Confirm Submit Modal -->
  <div id="confirm-overlay">
    <div class="modal" style="max-width:440px">
      <div class="modal-header">
        <span class="modal-title">Submit Quiz?</span>
        <button class="modal-close" onclick="closeConfirm()">✕</button>
      </div>
      <p style="margin-bottom:0.5rem">You are about to submit your quiz. This action cannot be undone.</p>
      <div id="unanswered-warning" class="alert alert-warning hidden" style="margin-top:0.75rem"></div>
      <div style="display:flex;gap:0.75rem;margin-top:1.5rem;justify-content:flex-end">
        <button class="btn btn-secondary" onclick="closeConfirm()">Cancel</button>
        <button id="btn-confirm-submit" class="btn btn-danger" onclick="submitQuiz()">Yes, Submit</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error('not auth');

    const params  = new URLSearchParams(location.search);
    const quizId  = parseInt(params.get('id'));
    if (!quizId) { location.href = 'dashboard.html'; }

    let attemptId, timeLimitAt, questions = [], currentQ = 0;
    let answers = {};   // { questionId: optionId }
    let timerInterval;

    // -------------------------------------------------------
    // INIT
    // -------------------------------------------------------
    async function initQuiz() {
      try {
        const { ok, data } = await API.post(`/quizzes/${quizId}/start`, {});
        if (!ok) {
          document.getElementById('loading-screen').innerHTML = `
            <div style="text-align:center;padding:2rem">
              <div style="font-size:3rem">⚠️</div>
              <h3 style="margin:1rem 0;color:var(--danger)">${data.message}</h3>
              <a href="dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
            </div>
          `;
          return;
        }

        attemptId  = data.attemptId;
        timeLimitAt = new Date(data.timeLimitAt);
        questions   = data.questions;

        document.getElementById('quiz-title').textContent = '';
        // Get quiz title
        const quizRes = await API.get(`/quizzes/${quizId}`);
        if (quizRes.ok) document.getElementById('quiz-title').textContent = quizRes.data.quiz.title;

        renderQuestions();
        renderDots();
        startTimer();

        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('quiz-ui').classList.remove('hidden');
      } catch (err) {
        document.getElementById('loading-screen').innerHTML = `
          <div style="text-align:center">
            <p style="color:var(--danger)">Failed to load quiz. Check server connection.</p>
            <a href="dashboard.html" class="btn btn-secondary mt-2">← Back</a>
          </div>
        `;
      }
    }

    // -------------------------------------------------------
    // RENDER QUESTIONS
    // -------------------------------------------------------
    function renderQuestions() {
      const container = document.getElementById('questions-container');
      container.innerHTML = questions.map((q, idx) => {
        const opts = (typeof q.options === 'string' ? JSON.parse(q.options) : q.options) || [];
        return `
          <div class="question-card ${idx === 0 ? 'active' : ''}" id="qcard-${idx}">
            <div class="question-num">Question ${idx + 1} of ${questions.length}</div>
            <div class="question-text">${escapeHtml(q.question_text)}</div>
            <div class="question-pts mono">⭐ ${q.points} point${q.points > 1 ? 's' : ''}</div>
            <ul class="options-list">
              ${opts.map(opt => `
                <li class="option-item" id="opt-item-${q.id}-${opt.id}" onclick="selectOption(${q.id}, ${opt.id}, ${idx})">
                  <input type="radio" name="q-${q.id}" id="opt-${q.id}-${opt.id}" value="${opt.id}" />
                  <label class="option-label" for="opt-${q.id}-${opt.id}">${escapeHtml(opt.text)}</label>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
      }).join('');
    }

    // -------------------------------------------------------
    // RENDER DOTS
    // -------------------------------------------------------
    function renderDots() {
      const nav = document.getElementById('q-nav');
      nav.innerHTML = questions.map((q, idx) => `
        <div class="q-dot ${idx === 0 ? 'current' : ''}" id="dot-${idx}" onclick="goTo(${idx})">${idx + 1}</div>
      `).join('');
    }

    // -------------------------------------------------------
    // NAVIGATION
    // -------------------------------------------------------
    function goTo(idx) {
      if (idx < 0 || idx >= questions.length) return;

      document.getElementById(`qcard-${currentQ}`)?.classList.remove('active');
      document.getElementById(`dot-${currentQ}`)?.classList.remove('current');

      currentQ = idx;

      document.getElementById(`qcard-${currentQ}`).classList.add('active');
      document.getElementById(`dot-${currentQ}`).classList.add('current');

      document.getElementById('btn-prev').disabled = currentQ === 0;
      document.getElementById('btn-next').textContent = currentQ === questions.length - 1 ? 'Finish →' : 'Next →';
      document.getElementById('q-progress-text').textContent = `Question ${currentQ + 1} of ${questions.length}`;
      updateProgress();
    }

    // -------------------------------------------------------
    // SELECT OPTION
    // -------------------------------------------------------
    async function selectOption(questionId, optionId, qIdx) {
      // Update UI
      const qCard = document.getElementById(`qcard-${qIdx}`);
      qCard.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
      document.getElementById(`opt-item-${questionId}-${optionId}`).classList.add('selected');
      document.getElementById(`opt-${questionId}-${optionId}`).checked = true;

      answers[questionId] = optionId;
      document.getElementById(`dot-${qIdx}`).classList.add('answered');
      if (document.getElementById(`dot-${qIdx}`).classList.contains('current')) {
        document.getElementById(`dot-${qIdx}`).classList.add('current');
      }
      updateProgress();

      // Auto-save to server
      try {
        await API.post(`/quizzes/attempts/${attemptId}/answer`, {
          questionId, optionId,
        });
      } catch (err) {
        Toast.show('Failed to save answer. Check connection.', 'warning');
      }
    }

    // -------------------------------------------------------
    // TIMER
    // -------------------------------------------------------
    function startTimer() {
      const fill    = document.getElementById('timer-fill');
      const display = document.getElementById('timer-display');
      const total   = (timeLimitAt - Date.now()) / 1000;

      timerInterval = setInterval(() => {
        const remaining = Math.max(0, (timeLimitAt - Date.now()) / 1000);
        const pct       = (remaining / total) * 100;

        display.textContent = `⏱ ${secondsToMMSS(Math.ceil(remaining))}`;
        fill.style.width    = `${pct}%`;

        fill.className    = 'timer-fill';
        display.className = 'timer-display';

        if (remaining <= 60)  { fill.classList.add('warning'); display.classList.add('warning'); }
        if (remaining <= 30)  { fill.classList.add('danger');  display.classList.add('danger');  }

        if (remaining <= 0) {
          clearInterval(timerInterval);
          autoSubmit();
        }
      }, 1000);
    }

    async function autoSubmit() {
      document.getElementById('timeout-overlay').style.display = 'flex';
      document.getElementById('timeout-overlay').classList.remove('hidden');
      try {
        const { data } = await API.post(`/quizzes/attempts/${attemptId}/submit`, {});
        setTimeout(() => window.location.href = `results.html?attemptId=${attemptId}`, 2000);
      } catch (err) {
        setTimeout(() => window.location.href = `results.html?attemptId=${attemptId}`, 2000);
      }
    }

    // -------------------------------------------------------
    // SUBMIT
    // -------------------------------------------------------
    function openConfirm() {
      const unanswered = questions.length - Object.keys(answers).length;
      const warn = document.getElementById('unanswered-warning');
      if (unanswered > 0) {
        warn.textContent = `⚠ You have ${unanswered} unanswered question${unanswered > 1 ? 's' : ''}. These will be marked as wrong.`;
        warn.classList.remove('hidden');
      } else {
        warn.classList.add('hidden');
      }
      document.getElementById('confirm-overlay').classList.add('open');
    }

    function closeConfirm() {
      document.getElementById('confirm-overlay').classList.remove('open');
    }

    async function submitQuiz() {
      clearInterval(timerInterval);
      setLoading('btn-confirm-submit', true);
      try {
        const { ok, data } = await API.post(`/quizzes/attempts/${attemptId}/submit`, {});
        if (!ok && data.message !== 'Time is up! Quiz auto-submitted.') {
          Toast.show(data.message || 'Submission failed.', 'error');
          setLoading('btn-confirm-submit', false);
          return;
        }
        window.location.href = `results.html?attemptId=${attemptId}`;
      } catch (err) {
        Toast.show('Network error during submission.', 'error');
        setLoading('btn-confirm-submit', false);
      }
    }

    // -------------------------------------------------------
    // UTILS
    // -------------------------------------------------------
    function updateProgress() {
      const answered = Object.keys(answers).length;
      const pct      = (answered / questions.length) * 100;
      document.getElementById('progress-fill').style.width = `${pct}%`;
      document.getElementById('q-answered-text').textContent = `${answered} answered`;
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    // Prevent accidental navigation
    window.addEventListener('beforeunload', e => {
      e.preventDefault();
      e.returnValue = '';
    });

    // Close modal on overlay click
    document.getElementById('confirm-overlay').addEventListener('click', function(e) {
      if (e.target === this) closeConfirm();
    });

    initQuiz();
  </script>
</body>
</html>
